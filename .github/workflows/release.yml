name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Generate bootstrap config template
        env:
          TWITCH_MARKER_AGENT_CLIENT_ID: ${{ vars.TWITCH_MARKER_AGENT_CLIENT_ID || secrets.TWITCH_MARKER_AGENT_CLIENT_ID }}
        run: |
          python -c "from pathlib import Path; import os; from twitch_marker_agent.core.config import resolve_client_id_seed, write_bootstrap_template; seed = resolve_client_id_seed(os.getenv('TWITCH_MARKER_AGENT_CLIENT_ID'), local_config_path=Path('local.config.json')); Path('build').mkdir(parents=True, exist_ok=True); write_bootstrap_template(Path('build/config.bootstrap.json'), client_id_seed=seed)"
          python -c "import json, sys; from pathlib import Path; from twitch_marker_agent.core.config import is_placeholder_client_id; data = json.loads(Path('build/config.bootstrap.json').read_text(encoding='utf-8')); client_id = str(data.get('client_id', '')).strip(); ok = not is_placeholder_client_id(client_id); print('Build blocked: bootstrap client_id is placeholder. Set TWITCH_MARKER_AGENT_CLIENT_ID repository variable or secret.', file=sys.stderr) if not ok else None; sys.exit(0 if ok else 1)"

      - name: Build executable
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --name "Automatic Twitch Markers" `
            --paths src `
            --collect-submodules pystray `
            --collect-submodules PIL `
            --hidden-import pystray._win32 `
            --hidden-import ttkbootstrap `
            --add-data "build\config.bootstrap.json;bootstrap" `
            src\twitch_marker_agent\app.py

      - name: Package artifact
        run: |
          Compress-Archive -Path "dist\Automatic Twitch Markers.exe" -DestinationPath automatic-twitch-markers-windows.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: automatic-twitch-markers-windows
          path: automatic-twitch-markers-windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: automatic-twitch-markers-windows.zip
          draft: false
          prerelease: false
