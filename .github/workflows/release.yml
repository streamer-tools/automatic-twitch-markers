name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --name TwitchMarkerAgent `
            --paths src `
            --collect-submodules pystray `
            --collect-submodules PIL `
            --hidden-import pystray._win32 `
            src\twitch_marker_agent\app.py

      - name: Package artifact
        run: |
          Compress-Archive -Path dist\TwitchMarkerAgent.exe -DestinationPath TwitchMarkerAgent-windows.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwitchMarkerAgent-windows
          path: TwitchMarkerAgent-windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: TwitchMarkerAgent-windows.zip
          draft: false
          prerelease: false
