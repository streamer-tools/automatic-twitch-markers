[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automatic-twitch-markers"
version = "0.6.0"
description = "A set-and-forget Twitch Marker Agent that automatically exports stream markers after broadcasts end"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "CodeWezus", email = "streamertools.dev@gmail.com"}
]
keywords = ["twitch", "stream", "markers", "export", "vod"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests",
    "websockets",
    "pystray",
    "Pillow",
    "ttkbootstrap>=1.5.0,<2.0",
]

[project.scripts]
auto-twitch-markers = "twitch_marker_agent.cli:main"

[project.urls]
Homepage = "https://github.com/streamer-tools/automatic-twitch-markers"
Repository = "https://github.com/streamer-tools/automatic-twitch-markers"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
